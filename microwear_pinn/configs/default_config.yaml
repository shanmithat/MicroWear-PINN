# MicroWear-PINN Configuration File

# Domain Definition
domain:
  L: 1.0        # Half-width of contact domain: x in [-L, L]
  D: 0.5        # Depth of half-space domain: y in [-D, 0]
  T: 1.0        # Total sliding time: t in [0, T]

# Physical Parameters
physics:
  mu: 0.3       # Coefficient of friction
  v_rel: 1.0    # Relative sliding velocity
  E_star: 200.0 # Effective Young's modulus (GPa or scaled)
  R: 5.0        # Cylinder radius (for Hertzian contact)
  P_load: 10.0  # Normal contact load per unit length

# Sub-Network Configurations
model:
  device: "cpu" # 'cpu' or 'cuda'
  # Wear Coefficient Sub-network k_w(x)
  k_w:
    use_rff: true
    rff_scale: 2.0
    rff_features: 32
    layers: [64, 64]
    activation: "tanh"
  # Wear Profile Sub-network h(x, t)
  h:
    use_rff: true
    rff_scale: 4.0
    rff_features: 64
    layers: [128, 128]
    activation: "tanh"
  # Airy Stress Function Sub-network Phi(x, y, t)
  phi:
    use_rff: true
    rff_scale: 2.0
    rff_features: 64
    layers: [128, 128, 128]
    activation: "tanh"

# Collocation Sampling Settings
sampling:
  method: "sobol" # 'sobol' or 'lhs' or 'random'
  n_interior: 10000
  n_boundary: 2000
  n_initial: 1000
  n_data: 500      # Number of sparse experimental points (if applicable)

# Training Hyperparameters
training:
  epochs_adam: 2000
  epochs_lbfgs: 300
  lr_adam: 0.001
  lr_lbfgs: 0.5
  weight_decay: 1.0e-5
  
  # Loss Weights (Initial or fixed values)
  loss_weights:
    wear: 1.0
    biharmonic: 0.1
    bc: 1.0
    data: 10.0
    reg: 1.0e-6

  # Adaptive Loss Weighting (SoftAdapt)
  adaptive_weighting:
    enabled: true
    method: "softadapt" # 'softadapt'
    beta: -0.1          # Negative beta weights slower-decreasing losses more
    update_every: 10    # Update weights every N epochs

# Benchmark / Run Settings
benchmark:
  type: "sinusoidal" # 'sinusoidal' or 'hertzian' or 'experimental'
  noise_level: 0.01  # Noise added to data for inverse problem testing
  save_dir: "results"
