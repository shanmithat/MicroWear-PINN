# NASA Milling Dataset Calibration Configuration

# Domain Definition (Physical units in mm and seconds)
domain:
  L: 1.0        # Half-width of contact zone (mm)
  D: 0.5        # Depth of bulk material (mm)
  T: 2880.0     # Maximum machining time (seconds) - Overridden by case data

# Physical Constants & Scaling References
physics:
  mu: 0.3       # Tool-workpiece friction coefficient
  v_rel: 3333.3 # Relative sliding velocity (mm/s) - Overridden by case data
  p_ref: 2500.0 # Reference pressure (MPa) for scaling inputs
  v_ref: 5000.0 # Reference velocity (mm/s) for scaling inputs
  k_w_init: 2.0e-7 # Expected wear coefficient scale
  alpha_clearance_deg: 11.0 # Tool flank clearance angle (degrees)

# Sub-Network Configurations
model:
  device: "cpu"
  parameterized: true # Enable (p, v_rel) parameters as inputs
  k_w:
    mode: "scalar"    # "scalar" for single-point VB calibration (unique identifiability), or "spatial"
    use_rff: true
    rff_scale: 1.5
    rff_features: 16
    layers: [64, 64]
    activation: "tanh"
  h:
    use_rff: true
    rff_scale: 2.0
    rff_features: 32
    layers: [128, 128]
    activation: "tanh"
  phi:
    use_rff: true
    rff_scale: 1.5
    rff_features: 32
    layers: [128, 128, 128]
    activation: "tanh"

# Collocation Sampling Settings
sampling:
  method: "sobol"
  n_interior: 2000
  n_boundary: 500
  n_initial: 200
  n_data: 100      # Sparse calibration data points

# Training Hyperparameters
training:
  epochs_adam: 500
  epochs_lbfgs: 15
  lr_adam: 0.001
  lr_lbfgs: 0.2
  weight_decay: 1.0e-5
  
  # Loss Weights (Initial or fixed values)
  loss_weights:
    wear: 1.0
    biharmonic: 0.05
    bc: 1.0
    init: 1.0
    data: 50.0       # Higher weight to force close calibration to experimental flank wear
    reg: 1.0e-6

  # Adaptive Loss Weighting (SoftAdapt)
  adaptive_weighting:
    enabled: true
    method: "softadapt"
    beta: 0.1
    update_every: 10

# Benchmark / Run Settings
benchmark:
  type: "nasa"
  case_id: 1
  noise_level: 0.0
  save_dir: "results"
